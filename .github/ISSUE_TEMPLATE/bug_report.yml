name: Bug report
description: Report a streaming, pairing, controller or UI problem.
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Shimmer version
      description: Shimmer → About, or `defaults read /Applications/Shimmer.app/Contents/Info CFBundleShortVersionString`
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Mac and macOS version
      placeholder: 'MacBook Pro 14" M5, macOS 27.1'
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: What you stream from
      description: Sunshine version, OS and GPU for a PC; firmware version for a PS5.
      placeholder: "Sunshine 2026.8.26 on Bazzite, RX 7800 XT / PS5 firmware 26.02"
    validations:
      required: true
  - type: dropdown
    id: link
    attributes:
      label: Network between the Mac and the host
      options:
        - Wired Ethernet (both ends)
        - Wi-Fi (Mac) → wired host
        - Wi-Fi both ends
        - VPN / Tailscale / remote
        - Not sure
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead. Rough times help.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: |
        Paste the output of
        `/Applications/Shimmer.app/Contents/Resources/shimmerctl doctor`, and if
        it's a streaming problem attach the session log from
        `~/Library/Logs/Shimmer/`. Addresses and machine names are redacted in
        both; read them before posting anyway.
